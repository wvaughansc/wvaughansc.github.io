<!DOCTYPE html>
<html>
<head>
  <style>
    /* Notion's Dark Mode Background Color */
    body { 
      margin: 0; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      background-color: #191919; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    button {
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.9);
      background-color: #3f3f3f;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover { background-color: #4f4f4f; border-color: rgba(255, 255, 255, 0.2); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>
  <button id="syncBtn" onclick="runSync()">Sync Now</button>

  <script>
    async function runSync() {
      const btn = document.getElementById('syncBtn');
      btn.disabled = true;
      btn.innerText = 'Syncing...';
      
      try {
        await fetch('https://script.google.com/macros/s/AKfycbzWHTYswzhbQX2VCyLuO64sP9wx9jE9yLWkOFiZypBagCiXlIZv2aR8HuyzZHyOHf2spA/exec', {
          method: 'POST',
          mode: 'no-cors'
        });
        btn.innerText = 'Sync Complete!';
      } catch (e) {
        btn.innerText = 'Error';
      }
      
      setTimeout(() => { btn.disabled = false; btn.innerText = 'Sync Now'; }, 3000);
    }
  </script>
</body>
</html>
