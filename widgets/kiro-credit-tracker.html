<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kiro Credit Tracker</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
      min-height: 100vh;
      color: #1a1a1a;
    }
    .tracker { width: 100%; max-width: 420px; }
    .card {
      background: #fff;
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 12px;
      padding: 1.75rem 2rem;
    }
    .app-title {
      font-size: 13px;
      font-weight: 500;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 0 0 1.25rem;
    }
    .label { font-size: 13px; color: #666; margin: 0 0 4px; }
    .big-num { font-size: 52px; font-weight: 500; color: #1a1a1a; margin: 0; line-height: 1.1; }
    .unit { font-size: 14px; color: #888; margin: 4px 0 0; }
    .divider { border: none; border-top: 1px solid rgba(0,0,0,0.08); margin: 1.25rem 0; }
    .meta-rows { display: flex; flex-direction: column; gap: 8px; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; }
    .meta-label { font-size: 13px; color: #666; }
    .meta-value { font-size: 13px; font-weight: 500; color: #1a1a1a; }
    .progress-bar-bg { background: #eee; border-radius: 999px; height: 6px; margin: 1.25rem 0 0.3rem; }
    .progress-bar-fill { height: 6px; border-radius: 999px; background: #1D9E75; transition: width 0.4s ease; }
    .progress-label { display: flex; justify-content: space-between; font-size: 12px; color: #999; }
    .refresh-btn {
      margin-top: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: none;
      border: 1px solid rgba(0,0,0,0.15);
      border-radius: 8px;
      padding: 8px 16px;
      cursor: pointer;
      font-size: 13px;
      color: #555;
      width: 100%;
      transition: background 0.15s;
    }
    .refresh-btn:hover { background: #f5f5f0; }
    .refresh-btn:active { transform: scale(0.98); }
    .timestamp { text-align: center; font-size: 11px; color: #bbb; margin-top: 8px; }
    .badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #e8f0fe;
      color: #1a56db;
      margin-left: 8px;
      vertical-align: middle;
    }
    #cap {
      transition: color 0.3s ease;
    }
    #cap.green { color: #10b981; }
    #cap.yellow { color: #f59e0b; }
    #cap.red { color: #ef4444; }

    @media (prefers-color-scheme: dark) {
      #cap.green { color: #6ee7b7; }
      #cap.yellow { color: #fbbf24; }
      #cap.red { color: #f87171; }
    }

    @media (prefers-color-scheme: dark) {
      body { background: #1a1a1a; color: #e8e8e8; }
      .card { background: #242424; border-color: rgba(255,255,255,0.08); }
      .label, .meta-label, .unit { color: #999; }
      .big-num, .meta-value { color: #e8e8e8; }
      .app-title { color: #666; }
      .divider { border-color: rgba(255,255,255,0.08); }
      .progress-bar-bg { background: #333; }
      .refresh-btn { border-color: rgba(255,255,255,0.12); color: #aaa; }
      .refresh-btn:hover { background: #2e2e2e; }
      .badge { background: #1e3a5f; color: #7eb3f5; }
    }
  </style>
</head>
<body>
<div class="tracker">
  <div class="card">
    <p class="app-title">Kiro Credit Tracker</p>

    <p class="label">Credits spent through today</p>
    <p class="big-num" id="cap">—</p>
    <p class="unit">cumulative cap</p>

    <hr class="divider">

    <div class="meta-rows">
      <div class="meta-row">
        <span class="meta-label">Completed workdays</span>
        <span class="meta-value" id="workday-num">—</span>
      </div>
      <div class="meta-row">
        <span class="meta-label">Daily rate</span>
        <span class="meta-value">50 credits / day</span>
      </div>
      <div class="meta-row">
        <span class="meta-label">Monthly budget</span>
        <span class="meta-value">1,000 credits</span>
      </div>
      <div class="meta-row">
        <span class="meta-label">Remaining budget</span>
        <span class="meta-value" id="remaining">—</span>
      </div>
    </div>

    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress" style="width:0%"></div>
    </div>
    <div class="progress-label">
      <span>0</span>
      <span id="progress-pct">0%</span>
      <span>1,000</span>
    </div>

    <button class="refresh-btn" onclick="update()" aria-label="Refresh credit cap">
      <i class="ti ti-refresh" aria-hidden="true"></i> Refresh
    </button>
    <p class="timestamp" id="timestamp"></p>
  </div>
</div>

<script>
  function countWorkdaysThrough(year, month, day) {
    let count = 0;
    for (let d = 1; d <= day; d++) {
      const dow = new Date(year, month, d).getDay();
      if (dow !== 0 && dow !== 6) count++;
    }
    return count;
  }

  function update() {
    const now = new Date();
    const year = now.getFullYear();
    const month = now.getMonth();
    const day = now.getDate();
    const dayOfWeek = now.getDay();
    const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;

    const workdayNum = countWorkdaysThrough(year, month, day);
    const cap = Math.min(workdayNum * 50, 1000);
    const remaining = 1000 - cap;
    const pct = Math.round((cap / 1000) * 100);

    const capEl = document.getElementById('cap');
    capEl.textContent = cap.toLocaleString();
    capEl.classList.remove('green', 'yellow', 'red');
    if (pct <= 40) capEl.classList.add('green');
    else if (pct <= 70) capEl.classList.add('yellow');
    else capEl.classList.add('red');
    document.getElementById('workday-num').innerHTML =
      workdayNum + (isWeekend ? '<span class="badge">Weekend</span>' : '');
    document.getElementById('remaining').textContent = remaining.toLocaleString() + ' credits';
    document.getElementById('progress').style.width = pct + '%';
    document.getElementById('progress-pct').textContent = pct + '%';

    const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const h = now.getHours(), m = now.getMinutes().toString().padStart(2,'0');
    const ampm = h >= 12 ? 'PM' : 'AM';
    const h12 = h % 12 || 12;
    document.getElementById('timestamp').textContent =
      'Updated ' + days[dayOfWeek] + ', ' + months[month] + ' ' + day + ' at ' + h12 + ':' + m + ' ' + ampm;
  }

  update();
</script>
</body>
</html>
