<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Regression Automation Progress</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0c0e14;
      --surface:   #13161f;
      --border:    #1e2231;
      --text:      #cdd5f0;
      --muted:     #5a6180;
      --done:      #4ade80;
      --skipped:   #facc15;
      --remaining: #2a2f42;
      --accent:    #6366f1;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 4rem;
    }

    header { text-align: center; margin-bottom: 2.5rem; }
    .eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }
    h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; color: #e8ecff; }
    .subtitle { font-size: 0.8rem; color: var(--muted); margin-top: 0.3rem; }

    #status {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--muted);
      text-align: center;
      min-height: 1.2rem;
      margin-bottom: 1.5rem;
    }
    #status.error { color: #f87171; }

    #dashboard {
      width: 100%;
      max-width: 520px;
      display: none;
      flex-direction: column;
      gap: 1.5rem;
    }
    #dashboard.visible { display: flex; }

    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem 1.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .chart-wrap { position: relative; width: 220px; height: 220px; }
    .chart-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .chart-pct {
      font-family: 'JetBrains Mono', monospace;
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--done);
      line-height: 1;
    }
    .chart-label {
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 0.25rem;
    }

    .legend {
      display: flex;
      gap: 1.5rem;
      margin-top: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .legend-item { display: flex; align-items: center; gap: 0.45rem; font-size: 0.75rem; color: var(--muted); }
    .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .legend-count { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: var(--text); }

    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; }
    .stat-pill {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 0.75rem;
      text-align: center;
    }
    .stat-pill .val { font-family: 'JetBrains Mono', monospace; font-size: 1.6rem; font-weight: 700; line-height: 1; }
    .stat-pill .lbl { font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-top: 0.35rem; }
    .stat-pill .bar { height: 3px; border-radius: 2px; margin-top: 0.75rem; width: 100%; }
    .stat-pill.done  .val { color: var(--done); }
    .stat-pill.done  .bar { background: var(--done); }
    .stat-pill.skip  .val { color: var(--skipped); }
    .stat-pill.skip  .bar { background: var(--skipped); }
    .stat-pill.total .val { color: #818cf8; }
    .stat-pill.total .bar { background: var(--accent); }

    .footer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .timestamp {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.62rem;
      color: var(--muted);
      letter-spacing: 0.06em;
    }
    button#refreshBtn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    button#refreshBtn:hover { border-color: var(--accent); color: var(--text); }
    button#refreshBtn:disabled { opacity: 0.4; cursor: not-allowed; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block;
      width: 10px; height: 10px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 0.4rem;
      vertical-align: middle;
    }
  </style>
</head>
<body>

  <header>
    <div class="eyebrow">Octave · EAM QA</div>
    <h1>Test Step Progress</h1>
    <p class="subtitle">Live from Notion</p>
  </header>

  <div id="status"></div>

  <div id="dashboard">
    <div class="chart-card">
      <div class="chart-wrap">
        <canvas id="donut"></canvas>
        <div class="chart-center">
          <span class="chart-pct" id="pctDisplay">0%</span>
          <span class="chart-label">complete</span>
        </div>
      </div>
      <div class="legend">
        <div class="legend-item">
          <span class="legend-dot" style="background:var(--done)"></span>
          Done — <span class="legend-count" id="legDone">0</span>
        </div>
        <div class="legend-item">
          <span class="legend-dot" style="background:var(--skipped)"></span>
          Skipped — <span class="legend-count" id="legSkip">0</span>
        </div>
        <div class="legend-item">
          <span class="legend-dot" style="background:var(--remaining)"></span>
          Remaining — <span class="legend-count" id="legRem">0</span>
        </div>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-pill done">
        <div class="val" id="statDone">0</div>
        <div class="lbl">Done</div>
        <div class="bar"></div>
      </div>
      <div class="stat-pill skip">
        <div class="val" id="statSkip">0</div>
        <div class="lbl">Skipped</div>
        <div class="bar"></div>
      </div>
      <div class="stat-pill total">
        <div class="val" id="statTotal">0</div>
        <div class="lbl">Total</div>
        <div class="bar"></div>
      </div>
    </div>

    <div class="footer-row">
      <span class="timestamp" id="timestamp"></span>
      <button id="refreshBtn" onclick="fetchProgress()">↺ refresh</button>
    </div>
  </div>
  </div>

  <script>
    let chart = null;

    function setStatus(msg, isError = false) {
      const el = document.getElementById('status');
      el.innerHTML = msg;
      el.className = isError ? 'error' : '';
    }

    function renderChart({
      total,
      done,
      skipped,
      remaining,
      executionPct,
      completionPct
    }) {

      remaining ??= Math.max(0, total - done - skipped);

      executionPct ??=
        total > 0
          ? Math.round((done / total) * 100)
          : 0;

      completionPct ??=
        total > 0
          ? Math.round(((done + skipped) / total) * 100)
          : 0;

      document.getElementById('pctDisplay').textContent =
        completionPct + '%';

      document.getElementById('legDone').textContent = done;
      document.getElementById('legSkip').textContent = skipped;
      document.getElementById('legRem').textContent = remaining;

      document.getElementById('statDone').textContent = done;
      document.getElementById('statSkip').textContent = skipped;
      document.getElementById('statTotal').textContent = total;

      const chartData = {
        labels: ['Done', 'Skipped', 'Remaining'],
        datasets: [{
          data: [
            done,
            skipped,
            remaining || (total === 0 ? 1 : 0)
          ],
          backgroundColor: [
            '#4ade80',
            '#facc15',
            '#2a2f42'
          ],
          borderWidth: 0
        }]
      };

      if (chart) {

        chart.data = chartData;
        chart.update();

      } else {

        chart = new Chart(
          document.getElementById('donut'),
          {
            type: 'doughnut',
            data: chartData,
            options: {
              cutout: '72%',
              plugins: {
                legend: {
                  display: false
                }
              }
            }
          }
        );

      }

      document.getElementById('timestamp').textContent =
        `${new Date().toLocaleString()} | Exec ${executionPct}% | Complete ${completionPct}%`;

      document
        .getElementById('dashboard')
        .classList.add('visible');
    }

    async function fetchProgress() {

      const btn =
        document.getElementById('refreshBtn');

      if (btn) btn.disabled = true;

      setStatus(
        '<span class="spinner"></span>Loading...'
      );

      try {

        const response =
          await fetch('/api/progress.js');

        if (!response.ok) {
          throw new Error(
            `Server returned ${response.status}`
          );
        }

        const data =
          await response.json();

        renderChart(data);

        setStatus('');

      } catch (err) {

        console.error(err);

        setStatus(
          'Error: ' + err.message,
          true
        );

      } finally {

        if (btn) btn.disabled = false;

      }
    }

    fetchProgress();

    setInterval(
      fetchProgress,
      300000
    );
  </script>

</body>
</html>
