<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outfit Picker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f0f0f;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            padding: 1.5rem;
            min-height: 100vh;
        }
        .container { max-width: 700px; margin: 0 auto; }
        h1 {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #fff;
        }
        .subtitle {
            color: #a0aec0;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        .input-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 2rem;
            background: #1a202c;
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid #2d3748;
        }
        .input-group {
            display: flex;
            flex-direction: column;
        }
        .input-group label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #cbd5e0;
            margin-bottom: 0.6rem;
        }
        select {
            padding: 0.8rem;
            background: #2d3748;
            border: 1px solid #4a5568;
            border-radius: 6px;
            color: #e0e0e0;
            font-size: 0.95rem;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        select:focus {
            outline: none;
            border-color: #3b82f6;
        }
        .outfit-display {
            background: #1a202c;
            border: 1px solid #2d3748;
            border-radius: 8px;
            padding: 2rem 1.5rem;
        }
        .outfit-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #2d3748;
        }
        .outfit-temp {
            font-size: 2.5rem;
            font-weight: 700;
            color: #3b82f6;
        }
        .outfit-context {
            flex: 1;
        }
        .outfit-context h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 0.2rem;
        }
        .outfit-context p {
            font-size: 0.9rem;
            color: #a0aec0;
        }
        .outfit-item {
            margin-bottom: 1.5rem;
        }
        .outfit-category {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            color: #a0aec0;
            letter-spacing: 0.5px;
            margin-bottom: 0.6rem;
        }
        .outfit-piece {
            background: linear-gradient(135deg, #2d3748 0%, #1a202c 100%);
            padding: 1rem;
            border-radius: 6px;
            border-left: 3px solid #3b82f6;
            font-weight: 500;
            color: #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .outfit-note {
            font-size: 0.85rem;
            color: #a0aec0;
            margin-top: 0.8rem;
            padding: 0.8rem;
            background: #2d3748;
            border-radius: 4px;
            border-left: 2px solid #718096;
        }
        .vibe {
            display: inline-block;
            background: #3b82f6;
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-right: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .tags {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #2d3748;
        }
        .tags h3 {
            font-size: 0.9rem;
            font-weight: 600;
            color: #cbd5e0;
            margin-bottom: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👔 Outfit Picker</h1>
        <p class="subtitle">What's the weather and what's on your plate?</p>

        <!-- INPUTS -->
        <div class="input-section">
            <div class="input-group">
                <label for="temp">Temperature</label>
                <select id="temp" onchange="updateOutfit()">
                    <option value="">— Select —</option>
                    <option value="cold">Below 50°F (Cold)</option>
                    <option value="cool">50–65°F (Cool)</option>
                    <option value="warm">65–75°F (Warm)</option>
                    <option value="hot">Above 75°F (Hot)</option>
                </select>
            </div>
            <div class="input-group">
                <label for="dayType">Day Type</label>
                <select id="dayType" onchange="updateOutfit()">
                    <option value="">— Select —</option>
                    <option value="work-home">Work from Home (Casual)</option>
                    <option value="on-campus">On Campus / Clients</option>
                    <option value="church">Church / Ministry</option>
                    <option value="kids-solo">Solo Kid Day (Practical)</option>
                    <option value="date">Date Night w/ Kala</option>
                </select>
            </div>
        </div>

        <!-- OUTFIT DISPLAY -->
        <div class="outfit-display" id="outfitDisplay" style="display: none;">
            <div class="outfit-header">
                <div class="outfit-temp" id="displayTemp">—</div>
                <div class="outfit-context">
                    <h2 id="displayContext">—</h2>
                    <p id="displayVibe">—</p>
                </div>
            </div>

            <div id="outfitBody"></div>
        </div>

        <!-- EMPTY STATE -->
        <div style="text-align: center; color: #718096; padding: 3rem 1rem; display: none;" id="emptyState">
            <p style="font-style: italic;">Pick a temperature and day type to get started</p>
        </div>
    </div>

    <script>
        const outfits = {
            // COLD (below 50°F)
            cold: {
                "work-home": {
                    vibe: "Cozy, functional",
                    pieces: [
                        { category: "Base", item: "Off-white tee or long-sleeve Henley" },
                        { category: "Outer", item: "Denim shirt (unbuttoned, classic look)" },
                        { category: "Bottoms", item: "Black jeans (your go-to)" },
                        { category: "Footwear", item: "Blundstones (suede or black)" },
                        { category: "Layer", item: "Consider a sweater under the denim if really chilly" }
                    ],
                    note: "You're home, so comfort + signature style. Unbuttoned denim over tee is your move."
                },
                "on-campus": {
                    vibe: "Polished, intentional",
                    pieces: [
                        { category: "Base", item: "Off-white or neutral tee" },
                        { category: "Outer", item: "Denim shirt (buttoned, more intentional)" },
                        { category: "Bottoms", item: "Black jeans (lighter wash okay too)" },
                        { category: "Jacket", item: "Casual jacket or overshirt" },
                        { category: "Footwear", item: "Black Blundstones" }
                    ],
                    note: "Step it up a notch for clients. Still Classic Americana, but crisper."
                },
                "church": {
                    vibe: "Ready to lead",
                    pieces: [
                        { category: "Base", item: "Off-white tee or neutral long-sleeve" },
                        { category: "Outer", item: "Denim or button-up (shows intentionality)" },
                        { category: "Bottoms", item: "Black or khaki pants (not super casual)" },
                        { category: "Footwear", item: "Black Blundstones or white sneakers" },
                        { category: "Accessories", item: "Apple Watch, simple & clean" }
                    ],
                    note: "You're leading worship. Show up put-together but approachable."
                },
                "kids-solo": {
                    vibe: "Practical, washable",
                    pieces: [
                        { category: "Base", item: "Off-white or grey tee" },
                        { category: "Outer", item: "Denim shirt (perfect for getting dirty)" },
                        { category: "Bottoms", item: "Black jeans (they hide mess)" },
                        { category: "Footwear", item: "Blundstones (easy on/off, durable)" }
                    ],
                    note: "Comfort + durability. You might end up covered in mud or paint. Own it."
                },
                "date": {
                    vibe: "Intentional, you",
                    pieces: [
                        { category: "Base", item: "Off-white or neutral tee (fitted)" },
                        { category: "Outer", item: "Denim or heavier button-up" },
                        { category: "Bottoms", item: "Black jeans (your best pair)" },
                        { category: "Footwear", item: "Black Blundstones or white sneakers" },
                        { category: "Vibe", item: "Classic, put-together, genuinely you" }
                    ],
                    note: "Kala knows your style. Be yourself, just intentional. No overthinking."
                }
            },

            // COOL (50-65°F)
            cool: {
                "work-home": {
                    vibe: "Layered, easy",
                    pieces: [
                        { category: "Base", item: "Off-white tee" },
                        { category: "Layer", item: "Denim shirt or light overshirt" },
                        { category: "Bottoms", item: "Black or lighter-wash jeans" },
                        { category: "Footwear", item: "Blundstones or white sneakers" }
                    ],
                    note: "Light jacket optional. Denim layer is your sweet spot."
                },
                "on-campus": {
                    vibe: "Polished, layered",
                    pieces: [
                        { category: "Base", item: "Off-white or grey tee" },
                        { category: "Outer", item: "Denim or casual button-up (buttoned)" },
                        { category: "Bottoms", item: "Black jeans or khaki pants" },
                        { category: "Footwear", item: "Black Blundstones or white sneakers" },
                        { category: "Light Layer", item: "Consider a casual jacket if needed" }
                    ],
                    note: "Layering works great at this temp. Shows intentionality."
                },
                "church": {
                    vibe: "Comfortable, ready",
                    pieces: [
                        { category: "Base", item: "Off-white or neutral tee" },
                        { category: "Outer", item: "Denim or button-up shirt" },
                        { category: "Bottoms", item: "Black jeans or khaki 365 pants" },
                        { category: "Footwear", item: "White sneakers or black Blundstones" }
                    ],
                    note: "This is ideal layering temp. Comfortable and approachable."
                },
                "kids-solo": {
                    vibe: "Active, practical",
                    pieces: [
                        { category: "Base", item: "Off-white or grey tee" },
                        { category: "Layer", item: "Denim shirt (easy to shed)" },
                        { category: "Bottoms", item: "Black jeans" },
                        { category: "Footwear", item: "Blundstones (durable for play)" }
                    ],
                    note: "You might be chasing kids. Denim layer gives you flexibility."
                },
                "date": {
                    vibe: "Put-together, warm",
                    pieces: [
                        { category: "Base", item: "Off-white or neutral tee (fitted)" },
                        { category: "Outer", item: "Denim shirt or heavier button-up" },
                        { category: "Bottoms", item: "Black jeans (your best pair)" },
                        { category: "Footwear", item: "Black Blundstones or white sneakers" }
                    ],
                    note: "Perfect dressing temp. Layering looks intentional. You'll feel good."
                }
            },

            // WARM (65-75°F)
            warm: {
                "work-home": {
                    vibe: "Relaxed, open",
                    pieces: [
                        { category: "Base", item: "Off-white tee (no layers needed)" },
                        { category: "Bottoms", item: "Black jeans or lighter-wash AE" },
                        { category: "Footwear", item: "White sneakers or Blundstones" }
                    ],
                    note: "NO JACKET. Keep it simple. Tee + jeans + sneakers = you."
                },
                "on-campus": {
                    vibe: "Intentional, no jacket",
                    pieces: [
                        { category: "Base", item: "Off-white or grey tee (fitted)" },
                        { category: "Optional", item: "Denim shirt (unbuttoned, slung over shoulder)" },
                        { category: "Bottoms", item: "Black jeans or khaki 365 pants" },
                        { category: "Footwear", item: "White sneakers or black Blundstones" }
                    ],
                    note: "Skip the jacket. If you want layers, carry the denim casual."
                },
                "church": {
                    vibe: "Approachable, clean",
                    pieces: [
                        { category: "Base", item: "Off-white tee or polo-style" },
                        { category: "Bottoms", item: "Black jeans or khaki 365 pants" },
                        { category: "Footwear", item: "White sneakers or black Blundstones" },
                        { category: "Watch", item: "Apple Watch (shows care for details)" }
                    ],
                    note: "No jacket. You're approachable, but put-together. Perfect."
                },
                "kids-solo": {
                    vibe: "Practical, easy",
                    pieces: [
                        { category: "Base", item: "Off-white or grey tee" },
                        { category: "Bottoms", item: "Black jeans (hide the mess)" },
                        { category: "Footwear", item: "White sneakers (easier for chasing kids)" }
                    ],
                    note: "Simple. You're running around. Comfort = priority."
                },
                "date": {
                    vibe: "Effortless, you",
                    pieces: [
                        { category: "Base", item: "Off-white or light tee (nice fit)" },
                        { category: "Optional", item: "Denim shirt (unbuttoned, draped casual)" },
                        { category: "Bottoms", item: "Black jeans (your best pair)" },
                        { category: "Footwear", item: "White sneakers (clean) or Blundstones" }
                    ],
                    note: "This temp is your sweet spot. Tee + jeans looks effortlessly good. Trust it."
                }
            },

            // HOT (above 75°F)
            hot: {
                "work-home": {
                    vibe: "Light, breathable",
                    pieces: [
                        { category: "Base", item: "Off-white or light grey tee (breathable)" },
                        { category: "Bottoms", item: "Lighter-wash AE jeans or grey 365 pants" },
                        { category: "Footwear", item: "White sneakers (breathable)" }
                    ],
                    note: "Keep it minimal. You're home, no need to overdress."
                },
                "on-campus": {
                    vibe: "Light, still intentional",
                    pieces: [
                        { category: "Base", item: "Off-white or neutral tee (quality fit)" },
                        { category: "Optional", item: "Denim shirt (very light wear, open the whole way)" },
                        { category: "Bottoms", item: "Lighter-wash jeans or khaki 365 pants" },
                        { category: "Footwear", item: "White sneakers" }
                    ],
                    note: "Light layers only if needed. Let the tee breathe."
                },
                "church": {
                    vibe: "Fresh, approachable",
                    pieces: [
                        { category: "Base", item: "Off-white or light tee" },
                        { category: "Bottoms", item: "Khaki or grey 365 pants" },
                        { category: "Footwear", item: "White sneakers (fresh, clean look)" }
                    ],
                    note: "Skip denim in this heat. You'll be leading worship = sweat-free is good."
                },
                "kids-solo": {
                    vibe: "Super practical",
                    pieces: [
                        { category: "Base", item: "Off-white or grey tee (any fit)" },
                        { category: "Bottoms", item: "Lighter jeans or grey pants" },
                        { category: "Footwear", item: "White sneakers (easy on/off)" }
                    ],
                    note: "Heat + kids = keep it simple and breathable."
                },
                "date": {
                    vibe: "Cool, intentional",
                    pieces: [
                        { category: "Base", item: "Off-white or light tee (fitted, nice quality)" },
                        { category: "Bottoms", item: "Lighter-wash jeans or khaki pants" },
                        { category: "Footwear", item: "White sneakers (your best pair, clean)" }
                    ],
                    note: "Less is more in heat. A nice tee + light pants looks effortless and good."
                }
            }
        };

        function updateOutfit() {
            const temp = document.getElementById('temp').value;
            const dayType = document.getElementById('dayType').value;
            const outfitDisplay = document.getElementById('outfitDisplay');
            const emptyState = document.getElementById('emptyState');

            if (!temp || !dayType) {
                outfitDisplay.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';
            const outfit = outfits[temp][dayType];

            const tempLabel = {
                cold: 'Below 50°F ❄️',
                cool: '50–65°F 🍂',
                warm: '65–75°F ☀️',
                hot: 'Above 75°F 🔥'
            }[temp];

            const dayLabel = {
                'work-home': 'Work from Home (Casual)',
                'on-campus': 'On Campus / Clients',
                'church': 'Church / Ministry',
                'kids-solo': 'Solo Kid Day',
                'date': 'Date Night w/ Kala'
            }[dayType];

            document.getElementById('displayTemp').textContent = tempLabel;
            document.getElementById('displayContext').textContent = dayLabel;
            document.getElementById('displayVibe').textContent = `Vibe: ${outfit.vibe}`;

            let piecesHTML = '';
            outfit.pieces.forEach(piece => {
                piecesHTML += `
                    <div class="outfit-item">
                        <div class="outfit-category">${piece.category}</div>
                        <div class="outfit-piece">
                            <span>${piece.item}</span>
                        </div>
                    </div>
                `;
            });

            piecesHTML += `
                <div class="outfit-note">
                    💭 ${outfit.note}
                </div>
            `;

            document.getElementById('outfitBody').innerHTML = piecesHTML;
            outfitDisplay.style.display = 'block';
        }
    </script>
</body>
</html>
