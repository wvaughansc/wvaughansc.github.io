<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #1a202c;
}

.snapshot-wrapper {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 1.5rem;
    max-width: 900px;
}

.header-section {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 2rem;
    margin-bottom: 2rem;
    flex-wrap: wrap;
}

.day-counter {
    flex: 0 0 auto;
}

.day-counter h1 {
    font-size: 28px;
    font-weight: 500;
    margin-bottom: 0.5rem;
    line-height: 1.2;
}

.day-counter p {
    font-size: 14px;
    color: #718096;
}

.year-progress {
    margin-top: 0.8rem;
    max-width: 320px;
}

.progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #718096;
    margin-bottom: 0.35rem;
}

.progress-bar {
    height: 8px;
    background: #edf2f7;
    border-radius: 999px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    background: linear-gradient(
        90deg,
        #38a169,
        #48bb78
    );
    border-radius: 999px;
    transition: width 0.5s ease;
}
    
.right-panel {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 1rem;
}

.info-card {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
}

.info-label {
    font-size: 12px;
    color: #718096;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 500;
}

.info-value {
    font-size: 16px;
    font-weight: 500;
}

.divider {
    height: 1px;
    background: #e2e8f0;
    margin: 1.5rem 0;
}

.moon-card {
    background: #f7fafc;
    border-radius: 8px;
    padding: 1.5rem;
    text-align: center;
}

.moon-emoji {
    font-size: 40px;
    margin-bottom: 0.5rem;
}

.moon-name {
    font-size: 15px;
    font-weight: 500;
}

.weather-summary {
    display: flex;
    gap: 1rem;
    align-items: center;
}

.weather-icon {
    font-size: 36px;
}

.weather-condition {
    font-size: 14px;
    color: #718096;
    margin-bottom: 0.3rem;
}

.weather-temp {
    font-size: 18px;
    font-weight: 600;
}

.loading {
    color: #718096;
    text-align: center;
    padding: 1rem;
}

.error {
    color: #c53030;
    text-align: center;
    padding: 1rem;
}

@media (max-width: 600px) {
    .snapshot-wrapper {
        padding: 1rem;
    }

    .header-section {
        flex-direction: column;
    }

    .right-panel {
        grid-template-columns: repeat(2, 1fr);
    }

    .weather-summary {
        flex-direction: column;
        text-align: center;
    }
}
</style>
</head>

<body>

<div id="snapshotWidget">
    <div class="snapshot-wrapper">
        <span class="loading">Loading snapshot...</span>
    </div>
</div>

<script>
const latitude = 34.891152;
const longitude = -82.308002;

function getDayOfYear(date) {
    const start = new Date(date.getFullYear(), 0, 0);
    return Math.floor((date - start) / 86400000);
}

function formatTime(date) {
    return date.toLocaleTimeString([], {
        hour: 'numeric',
        minute: '2-digit'
    });
}

function getWeatherIcon(code) {
    if ([0].includes(code)) return '☀️';
    if ([1,2].includes(code)) return '🌤️';
    if ([3].includes(code)) return '☁️';
    if ([45,48].includes(code)) return '🌫️';
    if ([51,53,55,61,63,65,80,81,82].includes(code)) return '🌧️';
    if ([71,73,75,77,85,86].includes(code)) return '❄️';
    if ([95,96,99].includes(code)) return '⛈️';
    return '🌡️';
}

function getWeatherDescription(code) {
    const map = {
        0:'Clear Sky',
        1:'Mainly Clear',
        2:'Partly Cloudy',
        3:'Overcast',
        45:'Fog',
        48:'Freezing Fog',
        51:'Light Drizzle',
        53:'Moderate Drizzle',
        55:'Dense Drizzle',
        61:'Light Rain',
        63:'Moderate Rain',
        65:'Heavy Rain',
        71:'Light Snow',
        73:'Moderate Snow',
        75:'Heavy Snow',
        80:'Rain Showers',
        81:'Rain Showers',
        82:'Heavy Showers',
        95:'Thunderstorm'
    };

    return map[code] || 'Current Conditions';
}

function getMoonPhase() {
    const now = new Date();

    const knownNewMoon =
        new Date('2000-01-06T18:14:00Z');

    const synodicMonth = 29.53058867;

    const daysSince =
        (now - knownNewMoon) /
        (1000 * 60 * 60 * 24);

    return ((daysSince % synodicMonth) /
        synodicMonth) * 100;
}

function getMoonEmoji(phase) {
    if (phase < 6.25 || phase >= 93.75) return '🌑';
    if (phase < 18.75) return '🌒';
    if (phase < 31.25) return '🌓';
    if (phase < 43.75) return '🌔';
    if (phase < 56.25) return '🌕';
    if (phase < 68.75) return '🌖';
    if (phase < 81.25) return '🌗';
    return '🌘';
}

function getMoonName(phase) {
    if (phase < 6.25 || phase >= 93.75) return 'New Moon';
    if (phase < 31.25) return 'Waxing Crescent';
    if (phase < 43.75) return 'First Quarter';
    if (phase < 56.25) return 'Full Moon';
    if (phase < 81.25) return 'Waning Gibbous';
    return 'Waning Crescent';
}

function getNextHoliday() {
    const today = new Date();

    const dayOfYear = getDayOfYear(today);

const daysInYear =
    ((today.getFullYear() % 4 === 0 &&
      today.getFullYear() % 100 !== 0) ||
      today.getFullYear() % 400 === 0)
        ? 366
        : 365;

const yearPercent =
    ((dayOfYear / daysInYear) * 100)
        .toFixed(1);
    
    const year = today.getFullYear();

    const holidays = [
        {name:"Independence Day", date:new Date(year,6,4)},
        {name:"Veterans Day", date:new Date(year,10,11)},
        {name:"Christmas", date:new Date(year,11,25)},
        {name:"New Year's Day", date:new Date(year+1,0,1)}
    ];

    return holidays.find(h => h.date > today);
}

async function getSnapshot() {

    try {

        const today = new Date();

        const response = await fetch(
            `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,weather_code&daily=sunrise,sunset&temperature_unit=fahrenheit&timezone=auto`
        );

        const data = await response.json();

        const temp =
            Math.round(data.current.temperature_2m);

        const weatherCode =
            data.current.weather_code;

        const weatherIcon =
            getWeatherIcon(weatherCode);

        const weatherDescription =
            getWeatherDescription(weatherCode);

        const sunrise =
            formatTime(new Date(data.daily.sunrise[0]));

        const sunset =
            formatTime(new Date(data.daily.sunset[0]));

        const moonPhase =
            getMoonPhase();

        const moonEmoji =
            getMoonEmoji(moonPhase);

        const moonName =
            getMoonName(moonPhase);

        const holiday =
            getNextHoliday();

        let holidayText = '';

        if (holiday) {
            const days =
                Math.ceil(
                    (holiday.date - today) /
                    86400000
                );

            holidayText =
                `${days} days until ${holiday.name}`;
        }

        document.getElementById('snapshotWidget').innerHTML = `
            <div class="snapshot-wrapper">

                <div class="header-section">

<div class="day-counter">
    <h1>
        Today is Day ${dayOfYear}
        of ${today.getFullYear()}
    </h1>

    <p>${holidayText}</p>

    <div class="year-progress">

        <div class="progress-label">
            <span>Year Progress</span>
            <span>${yearPercent}%</span>
        </div>

        <div class="progress-bar">
            <div
                class="progress-fill"
                style="width:${yearPercent}%"
            ></div>
        </div>

    </div>
</div>

                    <div class="right-panel">

                        <div class="info-card">
                            <div class="info-label">Sunrise</div>
                            <div class="info-value">${sunrise}</div>
                        </div>

                        <div class="info-card">
                            <div class="info-label">Sunset</div>
                            <div class="info-value">${sunset}</div>
                        </div>

                        <div class="info-card">
                            <div class="info-label">Moon</div>
                            <div class="info-value">${moonEmoji}</div>
                        </div>

                        <div class="info-card">
                            <div class="info-label">Temperature</div>
                            <div class="info-value">${temp}°F</div>
                        </div>

                    </div>

                </div>

                <div class="divider"></div>

                <div class="moon-card">
                    <div class="moon-emoji">${moonEmoji}</div>
                    <div class="moon-name">${moonName}</div>
                </div>

                <div class="divider"></div>

                <div class="weather-summary">
                    <div class="weather-icon">${weatherIcon}</div>
                    <div>
                        <div class="weather-condition">${weatherDescription}</div>
                        <div class="weather-temp">${temp}°F</div>
                    </div>
                </div>

            </div>
        `;

    } catch(error) {

        console.error(error);

        document.getElementById('snapshotWidget').innerHTML = `
            <div class="snapshot-wrapper">
                <div class="error">
                    Unable to load snapshot.
                </div>
            </div>
        `;
    }
}

getSnapshot();
setInterval(getSnapshot, 60 * 60 * 1000);
</script>

</body>
</html>
