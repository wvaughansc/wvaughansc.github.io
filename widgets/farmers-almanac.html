    <script>
        const US_HOLIDAYS_2026 = [
            { name: 'New Year\'s Day', date: new Date(2026, 0, 1) },
            { name: 'MLK Jr. Day', date: new Date(2026, 0, 19) },
            { name: 'Presidents\' Day', date: new Date(2026, 1, 16) },
            { name: 'Memorial Day', date: new Date(2026, 4, 25) },
            { name: 'Independence Day', date: new Date(2026, 6, 4) },
            { name: 'Labor Day', date: new Date(2026, 8, 7) },
            { name: 'Columbus Day', date: new Date(2026, 9, 12) },
            { name: 'Veterans Day', date: new Date(2026, 10, 11) },
            { name: 'Thanksgiving', date: new Date(2026, 10, 26) },
            { name: 'Christmas', date: new Date(2026, 11, 25) }
        ];
 
        function getDayOfYear(date) {
            const start = new Date(date.getFullYear(), 0, 0);
            const diff = date - start;
            const oneDay = 1000 * 60 * 60 * 24;
            return Math.floor(diff / oneDay);
        }
 
        function getNextHoliday() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            for (const holiday of US_HOLIDAYS_2026) {
                if (holiday.date >= today) {
                    return holiday;
                }
            }
            return null;
        }
 
        function getMoonEmoji(phase) {
            if (phase < 6.25) return '🌑';
            if (phase < 12.5) return '🌒';
            if (phase < 18.75) return '🌓';
            if (phase < 25) return '🌔';
            if (phase < 31.25) return '🌕';
            if (phase < 37.5) return '🌖';
            if (phase < 43.75) return '🌗';
            if (phase < 50) return '🌘';
            return '🌑';
        }
 
        function getMoonPhaseName(phase) {
            if (phase < 6.25 || phase >= 93.75) return 'New Moon';
            if (phase < 25) return 'Waxing Crescent';
            if (phase < 31.25) return 'First Quarter';
            if (phase < 50) return 'Waxing Gibbous';
            if (phase < 56.25) return 'Full Moon';
            if (phase < 75) return 'Waning Gibbous';
            if (phase < 81.25) return 'Last Quarter';
            return 'Waning Crescent';
        }
 
        async function getSnapshot() {
            try {
                const today = new Date();
                const dayOfYear = getDayOfYear(today);
                const latitude = 34.891152;
                const longitude = -82.308002;
 
                const fullYear = today.getFullYear();
 
                // Fetch moon phase data
                const moonResponse = await fetch(
                    `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&daily=moon_phase&timezone=auto&start_date=${today.toISOString().split('T')[0]}&end_date=${today.toISOString().split('T')[0]}`
                );
                const moonData = await moonResponse.json();
                const moonPhase = moonData.daily.moon_phase[0];
 
                // Fetch grid point for NWS data
                const pointsResponse = await fetch(
                    `https://api.weather.gov/points/${latitude},${longitude}`
                );
                const pointsData = await pointsResponse.json();
                const forecastUrl = pointsData.properties.forecast;
                const gridpointUrl = pointsData.properties.gridpoints.split('/').slice(0, -1).join('/');
 
                // Fetch forecast for current weather
                const forecastResponse = await fetch(forecastUrl);
                const forecastData = await forecastResponse.json();
                const currentPeriod = forecastData.properties.periods[0];
 
                // Fetch gridpoint data for sunrise/sunset
                const gridpointResponse = await fetch(gridpointUrl);
                const gridpointData = await gridpointResponse.json();
                const sunriseTime = new Date(gridpointData.properties.sunriseTime);
                const sunsetTime = new Date(gridpointData.properties.sunsetTime);
 
                const sunriseHour = sunriseTime.getHours();
                const sunriseMin = String(sunriseTime.getMinutes()).padStart(2, '0');
                const sunsetHour = sunsetTime.getHours();
                const sunsetMin = String(sunsetTime.getMinutes()).padStart(2, '0');
 
                const ampm = sunsetHour >= 12 ? 'PM' : 'AM';
                const sunsetDisplay = `${sunsetHour > 12 ? sunsetHour - 12 : sunsetHour}:${sunsetMin} ${ampm}`;
                const ampm2 = sunriseHour >= 12 ? 'PM' : 'AM';
                const sunriseDisplay = `${sunriseHour > 12 ? sunriseHour - 12 : sunriseHour}:${sunriseMin} ${ampm2}`;
 
                const nextHoliday = getNextHoliday();
                const daysToHoliday = nextHoliday ? Math.ceil((nextHoliday.date - today) / (1000 * 60 * 60 * 24)) : null;
 
                // Estimate next moon events (simplified)
                const moonPhaseName = getMoonPhaseName(moonPhase);
                const moonEmoji = getMoonEmoji(moonPhase);
 
                const temp = currentPeriod.temperature;
                const condition = currentPeriod.shortForecast;
 
                function getWeatherIcon(shortForecast) {
                    const forecast = shortForecast.toLowerCase();
                    if (forecast.includes('sunny') || forecast.includes('clear')) return '☀️';
                    if (forecast.includes('mostly sunny') || forecast.includes('mostly clear')) return '🌤️';
                    if (forecast.includes('partly cloudy')) return '⛅';
                    if (forecast.includes('cloudy') || forecast.includes('overcast')) return '☁️';
                    if (forecast.includes('fog')) return '🌫️';
                    if (forecast.includes('thunderstorm') || forecast.includes('severe thunderstorm')) return '⛈️';
                    if (forecast.includes('heavy rain') || forecast.includes('violent showers')) return '⛈️';
                    if (forecast.includes('rain') || forecast.includes('showers') || forecast.includes('drizzle')) return '🌧️';
                    if (forecast.includes('snow')) return '❄️';
                    if (forecast.includes('sleet') || forecast.includes('freezing')) return '❄️';
                    return '🌡️';
                }
 
                const weatherIcon = getWeatherIcon(condition);
 
                document.getElementById('snapshotWidget').innerHTML = `
                    <div class="snapshot-wrapper">
                        <div class="header-section">
                            <div class="day-counter">
                                <h1>Today is Day ${dayOfYear} of ${fullYear}</h1>
                                ${nextHoliday ? `<p>${daysToHoliday} days until ${nextHoliday.name}</p>` : ''}
                            </div>
 
                            <div class="right-panel">
                                <div class="info-card">
                                    <div class="info-label">Sunrise</div>
                                    <div class="info-value">${sunriseDisplay}</div>
                                </div>
 
                                <div class="info-card">
                                    <div class="info-label">Sunset</div>
                                    <div class="info-value">${sunsetDisplay}</div>
                                </div>
 
                                <div class="info-card">
                                    <div class="info-label">Moon Phase</div>
                                    <div class="info-value">${moonEmoji}</div>
                                </div>
 
                                <div class="info-card">
                                    <div class="info-label">Temperature</div>
                                    <div class="info-value">${temp}°F</div>
                                </div>
                            </div>
                        </div>
 
                        <div class="divider"></div>
 
                        <div class="moon-card" style="background: var(--color-background-secondary); padding: 1.5rem; text-align: center; border-radius: var(--border-radius-md);">
                            <div class="moon-emoji">${moonEmoji}</div>
                            <div class="moon-name">${moonPhaseName}</div>
                        </div>
 
                        <div class="divider"></div>
 
                        <div class="weather-summary">
                            <div class="weather-icon">${weatherIcon}</div>
                            <div class="weather-text">
                                <div class="weather-condition">${condition}</div>
                                <div class="weather-temp">${temp}°F</div>
                            </div>
                        </div>
                    </div>
                `;
 
            } catch (error) {
                console.error('Snapshot error:', error);
                document.getElementById('snapshotWidget').innerHTML = `
                    <div class="snapshot-wrapper">
                        <span class="error">Unable to load snapshot. Check console for details.</span>
                    </div>
                `;
            }
        }
 
        getSnapshot();
        setInterval(getSnapshot, 60 * 60 * 1000);
    </script>
