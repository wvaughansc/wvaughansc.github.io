<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Notion Countdown Wall</title>

<style>
    body {
        margin: 0;
        background: #0b0f14;
        font-family: monospace;
        color: #00ff99;
    }

    header {
        padding: 16px;
        font-size: 18px;
        border-bottom: 1px solid #1f2a36;
        display: flex;
        justify-content: space-between;
    }

    #grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 12px;
        padding: 12px;
    }

    .tile {
        background: #111821;
        border: 1px solid #1f2a36;
        padding: 12px;
        border-radius: 6px;
        box-shadow: 0 0 12px rgba(0,255,153,0.05);
        min-height: 90px;
    }

    .title {
        font-size: 14px;
        color: #ffffff;
        margin-bottom: 6px;
    }

    .date {
        font-size: 12px;
        color: #7dd3fc;
    }

    .countdown {
        font-size: 22px;
        margin-top: 8px;
        letter-spacing: 1px;
        color: #00ff99;
    }

    .label {
        font-size: 10px;
        color: #6b7280;
        margin-top: 6px;
    }
</style>
</head>

<body>

<header>
    <div>🕒 NEWSROOM PROJECT WALL</div>
    <div id="status">loading…</div>
</header>

<div id="grid"></div>

<script>
const API_URL = "https://wvaughansc-github-io.vercel.app/api/notion";

async function fetchNotion() {
    try {
        const res = await fetch(API_URL);

        if (!res.ok) {
            throw new Error(`HTTP ${res.status}`);
        }

        const data = await res.json();
        return data.results || [];

    } catch (err) {
        console.error("Fetch failed:", err);
        return [];
    }
}

function getTitle(page) {
    const titleProp = Object.values(page.properties).find(
        p => p.type === "title"
    );

    const text = titleProp?.title
        ?.map(t => t.plain_text)
        .join("");

    return text?.trim() || "Untitled Project";
}

function getDate(page) {
    const dateString = page.properties?.Date?.date?.start;

    if (!dateString) return null;

    const date = new Date(dateString);

    return isNaN(date.getTime()) ? null : date;
}

function sortByDeadline(items) {
    return [...items].sort((a, b) => {
        const aDate = getDate(a);
        const bDate = getDate(b);

        const aTime = aDate ? aDate.getTime() : Number.MAX_SAFE_INTEGER;
        const bTime = bDate ? bDate.getTime() : Number.MAX_SAFE_INTEGER;

        return aTime - bTime;
    });
}

function formatCountdown(target) {
    if (!target) return "NO DATE";

    const now = new Date();
    const diff = target.getTime() - now.getTime();

    if (diff <= 0) {
        const overdue = Math.abs(diff);

        const days = Math.floor(overdue / 86400000);
        const hours = Math.floor((overdue % 86400000) / 3600000);

        return `OVERDUE ${days}d ${hours}h`;
    }

    const totalSeconds = Math.floor(diff / 1000);

    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    return `${days}d ${hours}h ${minutes}m ${seconds}s`;
}

async function render() {
    const grid = document.getElementById("grid");
    const status = document.getElementById("status");

    status.innerText = "Loading...";

    const items = await fetchNotion();

    grid.innerHTML = "";

    if (!items.length) {
        status.innerText = "0 projects";
        return;
    }

    const sorted = sortByDeadline(items);

    status.innerText = `${sorted.length} projects`;

    sorted.forEach(page => {
        const title = getTitle(page);
        const date = getDate(page);

        const tile = document.createElement("div");
        tile.className = "tile";

        tile.innerHTML = `
            <div class="title">${title}</div>
            <div class="date">
                ${date ? date.toLocaleDateString() : "No date set"}
            </div>
            <div class="countdown"></div>
            <div class="label">COUNTDOWN</div>
        `;

        const countdownEl = tile.querySelector(".countdown");

        function updateCountdown() {
            countdownEl.textContent = formatCountdown(date);
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);

        grid.appendChild(tile);
    });
}

render();
</script>

</body>
</html>
