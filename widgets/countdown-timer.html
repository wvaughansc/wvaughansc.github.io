<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Notion Countdown Wall</title>

<style>
    body {
        margin: 0;
        background: #0b0f14;
        font-family: monospace;
        color: #00ff99;
    }

    header {
        padding: 16px;
        font-size: 18px;
        border-bottom: 1px solid #1f2a36;
        display: flex;
        justify-content: space-between;
    }

    #grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 12px;
        padding: 12px;
    }

    .tile {
        background: #111821;
        border: 1px solid #1f2a36;
        padding: 12px;
        border-radius: 6px;
        box-shadow: 0 0 12px rgba(0,255,153,0.05);
        min-height: 90px;
    }

    .title {
        font-size: 14px;
        color: #ffffff;
        margin-bottom: 6px;
    }

    .date {
        font-size: 12px;
        color: #7dd3fc;
    }

    .countdown {
        font-size: 22px;
        margin-top: 8px;
        letter-spacing: 1px;
        color: #00ff99;
    }

    .label {
        font-size: 10px;
        color: #6b7280;
        margin-top: 6px;
    }
</style>
</head>

<body>

<header>
    <div>🕒 NEWSROOM PROJECT WALL</div>
    <div id="status">loading…</div>
</header>

<div id="grid"></div>

<script>
const NOTION_TOKEN = "YOUR_NOTION_TOKEN";
const DATABASE_ID = "YOUR_DATABASE_ID";
const DATE_PROPERTY = "Date"; // change if needed

async function fetchNotion() {
    try {
        const res = await fetch("https://wvaughansc-github-io.vercel.app/api/notion");

        console.log("STATUS:", res.status);

        const text = await res.text();
        console.log("RAW RESPONSE:", text);

        return JSON.parse(text).results || [];

    } catch (err) {
        console.error("FETCH FAILED:", err);
        return [];
    }
}

function getTitle(page) {
    const titleProp = Object.values(page.properties).find(
        p => p.type === "title"
    );

    const text = titleProp?.title?.map(t => t.plain_text).join("");

    return text && text.trim().length > 0 ? text : "Untitled Project";
}

function getDate(page) {
    const date = page.properties?.Date?.date?.start;
    return date ? new Date(date) : null;
}

function sortByDeadline(items) {
    return items.sort((a, b) => {
        const aDate = getDate(a);
        const bDate = getDate(b);

        if (!aDate && !bDate) return 0;
        if (!aDate) return 1;
        if (!bDate) return -1;

        return aDate - bDate; // closest first
    });
}
    
function formatCountdown(target) {
    if (!target) return "— NO DATE —";

    const now = new Date();
    const diff = target - now;

    if (isNaN(diff)) return "— INVALID —";

    if (diff <= 0) return "⛔ DUE";

    const s = Math.floor(diff / 1000);
    const d = Math.floor(s / 86400);
    const h = Math.floor((s % 86400) / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;

    return `${d}d ${h}h ${m}m ${sec}s`;
}
status.innerText = "fetching Notion...";
async function render() {
    const items = await fetchNotion();
    const grid = document.getElementById("grid");
    const status = document.getElementById("status");

status.innerText = "❌ API failed (check console)";
    
    grid.innerHTML = "";

    const sorted = sortByDeadline(items);

   if (!sorted.length) {
    status.innerText = "⚠️ No data loaded (check API)";
} else {
    status.innerText = `${sorted.length} projects`;
}

    sorted.forEach(page => {
        const title = getTitle(page);
        const date = getDate(page);

        const tile = document.createElement("div");
        tile.className = "tile";

        tile.innerHTML = `
            <div class="title">${title}</div>
            <div class="date">${date ? date.toDateString() : "No date set"}</div>
            <div class="countdown"></div>
            <div class="label">COUNTDOWN</div>
        `;

        grid.appendChild(tile);

        const el = tile.querySelector(".countdown");

        function update() {
            el.innerText = formatCountdown(date);
        }

        update();
        setInterval(update, 1000);
    });
}

render();
</script>

</body>
</html>
