<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pomodoro Timer</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:transparent;
}

.widget{
    width:100%;
    max-width:300px;
    background:#1a202c;
    border:1px solid #2d3748;
    border-radius:12px;
    padding:20px;
    text-align:center;
    color:#e2e8f0;
}

.title{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:#94a3b8;
    margin-bottom:12px;
}

.timer{
    font-size:48px;
    font-weight:700;
    color:white;
    margin-bottom:16px;
}

.status{
    font-size:13px;
    color:#94a3b8;
    margin-bottom:16px;
}

.buttons{
    display:flex;
    gap:8px;
    justify-content:center;
    margin-bottom:14px;
}

button{
    border:none;
    border-radius:8px;
    padding:8px 14px;
    cursor:pointer;
    font-size:13px;
    font-weight:600;
}

.start{
    background:#22c55e;
    color:white;
}

.pause{
    background:#f59e0b;
    color:white;
}

.reset{
    background:#475569;
    color:white;
}

.sessions{
    font-size:13px;
    color:#cbd5e1;
}
</style>
</head>

<body>

<div class="widget">

    <div class="title">Pomodoro Focus</div>

    <div class="timer" id="timer">
        25:00
    </div>

    <div class="status" id="status">
        Ready to Focus
    </div>

    <div class="buttons">
        <button class="start" onclick="startTimer()">Start</button>
        <button class="pause" onclick="pauseTimer()">Pause</button>
        <button class="reset" onclick="resetTimer()">Reset</button>
    </div>

    <div class="sessions">
        Completed Sessions:
        <span id="sessions">0</span>
    </div>

</div>

<script>

const POMODORO_SECONDS = 25 * 60;

let timeLeft = POMODORO_SECONDS;
let timerRunning = false;
let interval;
let completedSessions = 0;

const timerEl = document.getElementById("timer");
const statusEl = document.getElementById("status");
const sessionsEl = document.getElementById("sessions");

function updateDisplay(){

    const minutes = Math.floor(timeLeft / 60);
    const seconds = timeLeft % 60;

    timerEl.textContent =
        `${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;
}

function startTimer(){

    if(timerRunning) return;

    timerRunning = true;
    statusEl.textContent = "Focus Time";

    interval = setInterval(() => {

        timeLeft--;

        updateDisplay();

        if(timeLeft <= 0){

            clearInterval(interval);

            timerRunning = false;

            completedSessions++;

            sessionsEl.textContent = completedSessions;

            statusEl.textContent = "Session Complete";

            if(Notification.permission === "granted"){
                new Notification("Pomodoro Complete!");
            }

            alert("🍅 Pomodoro Complete!");

            timeLeft = POMODORO_SECONDS;
            updateDisplay();
        }

    },1000);
}

function pauseTimer(){

    clearInterval(interval);
    timerRunning = false;
    statusEl.textContent = "Paused";
}

function resetTimer(){

    clearInterval(interval);

    timerRunning = false;

    timeLeft = POMODORO_SECONDS;

    updateDisplay();

    statusEl.textContent = "Ready to Focus";
}

if("Notification" in window){
    Notification.requestPermission();
}

updateDisplay();

</script>

</body>
</html>
