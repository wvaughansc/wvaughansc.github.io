<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taylors Weather</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            padding: 1rem;
        }
        .weather-container {
            background: #1a202c;
            border: 1px solid #2d3748;
            border-radius: 8px;
            padding: 1.5rem;
            max-width: 400px;
            color: #e0e0e0;
        }
        .weather-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1.5rem;
        }
        .weather-location {
            font-size: 0.9rem;
            color: #a0aec0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        .weather-main {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .weather-icon {
            font-size: 3rem;
        }
        .weather-temp {
            font-size: 2.5rem;
            font-weight: 700;
            color: #fff;
            line-height: 1;
        }
        .weather-condition {
            font-size: 0.95rem;
            color: #cbd5e0;
            margin-top: 0.3rem;
        }
        .weather-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #2d3748;
        }
        .detail-item {
            display: flex;
            flex-direction: column;
        }
        .detail-label {
            font-size: 0.75rem;
            color: #718096;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.3rem;
        }
        .detail-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: #e0e0e0;
        }
        .loading {
            text-align: center;
            color: #718096;
            padding: 2rem 1rem;
            font-size: 0.9rem;
        }
        .error {
            text-align: center;
            color: #ef4444;
            padding: 1rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="weather-container" id="weatherWidget">
        <div class="loading">Loading weather...</div>
    </div>

    <script>
        async function getWeather() {
            try {
                // Greer, SC coordinates
                const latitude = 34.98;
                const longitude = -82.33;
                
                const response = await fetch(
                    `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&temperature_unit=fahrenheit&timezone=auto`
                );
                
                const data = await response.json();
                const current = data.current;
                
                // Weather code to emoji/description mapping
                const weatherCodes = {
                    0: { emoji: '☀️', desc: 'Clear' },
                    1: { emoji: '🌤️', desc: 'Mostly Clear' },
                    2: { emoji: '⛅', desc: 'Partly Cloudy' },
                    3: { emoji: '☁️', desc: 'Cloudy' },
                    45: { emoji: '🌫️', desc: 'Foggy' },
                    48: { emoji: '🌫️', desc: 'Foggy' },
                    51: { emoji: '🌧️', desc: 'Light Drizzle' },
                    53: { emoji: '🌧️', desc: 'Drizzle' },
                    55: { emoji: '🌧️', desc: 'Heavy Drizzle' },
                    61: { emoji: '🌧️', desc: 'Light Rain' },
                    63: { emoji: '🌧️', desc: 'Rain' },
                    65: { emoji: '⛈️', desc: 'Heavy Rain' },
                    71: { emoji: '❄️', desc: 'Light Snow' },
                    73: { emoji: '❄️', desc: 'Snow' },
                    75: { emoji: '❄️', desc: 'Heavy Snow' },
                    80: { emoji: '🌧️', desc: 'Showers' },
                    81: { emoji: '⛈️', desc: 'Heavy Showers' },
                    82: { emoji: '⛈️', desc: 'Violent Showers' },
                    95: { emoji: '⛈️', desc: 'Thunderstorm' },
                    96: { emoji: '⛈️', desc: 'Thunderstorm' },
                    99: { emoji: '⛈️', desc: 'Thunderstorm' }
                };
                
                const weather = weatherCodes[current.weather_code] || { emoji: '🌡️', desc: 'Unknown' };
                const temp = Math.round(current.temperature_2m);
                
                const widget = document.getElementById('weatherWidget');
                widget.innerHTML = `
                    <div class="weather-header">
                        <div class="weather-location">🌍 Taylors, SC</div>
                    </div>
                    <div class="weather-main">
                        <div class="weather-icon">${weather.emoji}</div>
                        <div>
                            <div class="weather-temp">${temp}°</div>
                            <div class="weather-condition">${weather.desc}</div>
                        </div>
                    </div>
                    <div class="weather-details">
                        <div class="detail-item">
                            <div class="detail-label">Feels Like</div>
                            <div class="detail-value">${Math.round(current.apparent_temperature)}°</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Humidity</div>
                            <div class="detail-value">${current.relative_humidity_2m}%</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Wind</div>
                            <div class="detail-value">${Math.round(current.wind_speed_10m)} mph</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Updated</div>
                            <div class="detail-value">${new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })}</div>
                        </div>
                    </div>
                `;
            } catch (error) {
                document.getElementById('weatherWidget').innerHTML = `
                    <div class="error">
                        Unable to load weather. Check your connection.
                    </div>
                `;
            }
        }
        
        getWeather();
        // Refresh every 30 minutes
        setInterval(getWeather, 30 * 60 * 1000);
    </script>
</body>
</html>
