<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taylors Weather</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .weather-wrapper {
            background: #1a202c;
            border: 1px solid #2d3748;
            color: #e0e0e0;
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
        }

        .weather-container {
            padding: 0.8rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            min-height: 50px;
        }

        .weather-location {
            font-size: 0.75rem;
            color: #a0aec0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            white-space: nowrap;
        }

        .weather-main {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-shrink: 0;
        }

        .weather-icon {
            font-size: 1.8rem;
        }

        .weather-temp {
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            line-height: 1;
        }

        .weather-condition {
            font-size: 0.8rem;
            color: #cbd5e0;
        }

        .weather-details {
            display: flex;
            gap: 1.5rem;
            margin-left: auto;
            flex-shrink: 0;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.2rem;
        }

        .detail-label {
            font-size: 0.7rem;
            color: #718096;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .detail-value {
            font-size: 0.95rem;
            font-weight: 600;
            color: #e0e0e0;
        }

        .forecast-container {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 1rem;
            border-top: 1px solid #2d3748;
            background: #161b26;
            overflow-x: auto;
        }

        .forecast-day {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
            flex: 0 0 auto;
            min-width: 70px;
        }

        .forecast-name {
            font-size: 0.7rem;
            color: #a0aec0;
            font-weight: 600;
        }

        .forecast-icon {
            font-size: 1.2rem;
        }

        .forecast-temp {
            font-size: 0.75rem;
            text-align: center;
        }

        .forecast-high {
            color: #fff;
            font-weight: 700;
        }

        .forecast-low {
            color: #718096;
        }

        .loading {
            color: #718096;
            font-size: 0.85rem;
            padding: 1rem;
        }

        .error {
            color: #ef4444;
            font-size: 0.85rem;
            padding: 1rem;
        }

        @media (max-width: 768px) {
            .weather-container {
                flex-wrap: wrap;
                gap: 1rem;
            }

            .weather-details {
                width: 100%;
                justify-content: space-around;
                margin-left: 0;
            }

            .forecast-day {
                min-width: 60px;
            }
        }
    </style>
</head>

<body>
    <div id="weatherWidget">
        <span class="loading">Loading weather...</span>
    </div>

    <script>
        function getWeatherIcon(shortForecast) {
            const forecast = shortForecast.toLowerCase();
            
            if (forecast.includes('sunny') || forecast.includes('clear')) return '☀️';
            if (forecast.includes('mostly sunny') || forecast.includes('mostly clear')) return '🌤️';
            if (forecast.includes('partly cloudy')) return '⛅';
            if (forecast.includes('cloudy') || forecast.includes('overcast')) return '☁️';
            if (forecast.includes('fog')) return '🌫️';
            if (forecast.includes('thunderstorm') || forecast.includes('severe thunderstorm')) return '⛈️';
            if (forecast.includes('heavy rain') || forecast.includes('violent showers')) return '⛈️';
            if (forecast.includes('rain') || forecast.includes('showers') || forecast.includes('drizzle')) return '🌧️';
            if (forecast.includes('snow')) return '❄️';
            if (forecast.includes('sleet') || forecast.includes('freezing')) return '❄️';
            if (forecast.includes('wind')) return '💨';
            
            return '🌡️';
        }

        async function getWeather() {
            try {
                const latitude = 34.891152;
                const longitude = -82.308002;

                // Step 1: Get grid point data
                const pointsResponse = await fetch(
                    `https://api.weather.gov/points/${latitude},${longitude}`
                );

                if (!pointsResponse.ok) throw new Error('Failed to get grid point');
                
                const pointsData = await pointsResponse.json();
                const forecastUrl = pointsData.properties.forecast;

                // Step 2: Get forecast data
                const forecastResponse = await fetch(forecastUrl);
                
                if (!forecastResponse.ok) throw new Error('Failed to get forecast');
                
                const forecastData = forecastResponse.json();

                forecastData.then(data => {
                    const periods = data.properties.periods;
                    
                    // Get current conditions (first period)
                    const currentPeriod = periods[0];
                    const isDaytime = currentPeriod.isDaytime;
                    
                    const temp = currentPeriod.temperature;
                    const shortForecast = currentPeriod.shortForecast;
                    const windSpeed = currentPeriod.windSpeed;
                    const weather = getWeatherIcon(shortForecast);

                    // Group periods by day for forecast
                    const dailyForecasts = [];
                    const seenDays = new Set();
                    
                    periods.forEach((period, index) => {
                        const dayName = period.name.split(' ')[0];
                        if (!seenDays.has(dayName) && index < 14) {
                            seenDays.add(dayName);
                            dailyForecasts.push(period);
                        }
                    });

                    const forecastHTML = dailyForecasts.slice(0, 7).map((period) => {
                        return `
                            <div class="forecast-day">
                                <div class="forecast-name">${period.name}</div>
                                <div class="forecast-icon">${getWeatherIcon(period.shortForecast)}</div>
                                <div class="forecast-temp">
                                    <span class="forecast-high">
                                        ${period.temperature}°
                                    </span>
                                </div>
                            </div>
                        `;
                    }).join('');

                    document.getElementById('weatherWidget').innerHTML = `
                        <div class="weather-wrapper">
                            <div class="weather-container">

                                <div class="weather-location">
                                    🌍 Taylors
                                </div>

                                <div class="weather-main">
                                    <div class="weather-icon">
                                        ${weather}
                                    </div>

                                    <div>
                                        <div class="weather-temp">
                                            ${temp}°
                                        </div>

                                        <div class="weather-condition">
                                            ${shortForecast}
                                        </div>
                                    </div>
                                </div>

                                <div class="weather-details">

                                    <div class="detail-item">
                                        <div class="detail-label">Wind</div>
                                        <div class="detail-value">
                                            ${windSpeed}
                                        </div>
                                    </div>

                                </div>
                            </div>

                            <div class="forecast-container">
                                ${forecastHTML}
                            </div>
                        </div>
                    `;
                }).catch(err => {
                    throw err;
                });

            } catch (error) {
                console.error('Weather error:', error);
                document.getElementById('weatherWidget').innerHTML =
                    `<span class="error">Unable to load weather</span>`;
            }
        }

        getWeather();

        // Refresh every 30 minutes
        setInterval(getWeather, 30 * 60 * 1000);
    </script>
</body>
</html>
