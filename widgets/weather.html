<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taylors Weather</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .weather-wrapper {
            background: #1a202c;
            border: 1px solid #2d3748;
            color: #e0e0e0;
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
        }

        .weather-container {
            padding: 0.8rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            min-height: 50px;
        }

        .weather-location {
            font-size: 0.75rem;
            color: #a0aec0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            white-space: nowrap;
        }

        .weather-main {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-shrink: 0;
        }

        .weather-icon {
            font-size: 1.8rem;
        }

        .weather-temp {
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            line-height: 1;
        }

        .weather-condition {
            font-size: 0.8rem;
            color: #cbd5e0;
        }

        .weather-details {
            display: flex;
            gap: 1.5rem;
            margin-left: auto;
            flex-shrink: 0;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.2rem;
        }

        .detail-label {
            font-size: 0.7rem;
            color: #718096;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .detail-value {
            font-size: 0.95rem;
            font-weight: 600;
            color: #e0e0e0;
        }

        .forecast-container {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 1rem;
            border-top: 1px solid #2d3748;
            background: #161b26;
        }

        .forecast-day {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
            flex: 1;
        }

        .forecast-name {
            font-size: 0.7rem;
            color: #a0aec0;
            font-weight: 600;
        }

        .forecast-icon {
            font-size: 1.2rem;
        }

        .forecast-temp {
            font-size: 0.75rem;
            text-align: center;
        }

        .forecast-high {
            color: #fff;
            font-weight: 700;
        }

        .forecast-low {
            color: #718096;
        }

        .loading {
            color: #718096;
            font-size: 0.85rem;
            padding: 1rem;
        }

        .error {
            color: #ef4444;
            font-size: 0.85rem;
            padding: 1rem;
        }

        @media (max-width: 768px) {
            .weather-container {
                flex-wrap: wrap;
                gap: 1rem;
            }

            .weather-details {
                width: 100%;
                justify-content: space-around;
                margin-left: 0;
            }

            .forecast-container {
                overflow-x: auto;
            }

            .forecast-day {
                min-width: 60px;
            }
        }
    </style>
</head>

<body>
    <div id="weatherWidget">
        <span class="loading">Loading weather...</span>
    </div>

    <script>
        async function getWeather() {
            try {
                const latitude = 34.891152;
                const longitude = -82.308002;

                const response = await fetch(
                    `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=auto&forecast_days=7`
                );

                const data = await response.json();
                const current = data.current;

                const weatherCodes = {
                    0: { emoji: '☀️', desc: 'Clear' },
                    1: { emoji: '🌤️', desc: 'Mostly Clear' },
                    2: { emoji: '⛅', desc: 'Partly Cloudy' },
                    3: { emoji: '☁️', desc: 'Cloudy' },
                    45: { emoji: '🌫️', desc: 'Foggy' },
                    48: { emoji: '🌫️', desc: 'Foggy' },
                    51: { emoji: '🌧️', desc: 'Light Drizzle' },
                    53: { emoji: '🌧️', desc: 'Drizzle' },
                    55: { emoji: '🌧️', desc: 'Heavy Drizzle' },
                    61: { emoji: '🌧️', desc: 'Light Rain' },
                    63: { emoji: '🌧️', desc: 'Rain' },
                    65: { emoji: '⛈️', desc: 'Heavy Rain' },
                    71: { emoji: '❄️', desc: 'Light Snow' },
                    73: { emoji: '❄️', desc: 'Snow' },
                    75: { emoji: '❄️', desc: 'Heavy Snow' },
                    80: { emoji: '🌧️', desc: 'Showers' },
                    81: { emoji: '⛈️', desc: 'Heavy Showers' },
                    82: { emoji: '⛈️', desc: 'Violent Showers' },
                    95: { emoji: '⛈️', desc: 'Thunderstorm' },
                    96: { emoji: '⛈️', desc: 'Thunderstorm' },
                    99: { emoji: '⛈️', desc: 'Thunderstorm' }
                };

                const weather =
                    weatherCodes[current.weather_code] ||
                    { emoji: '🌡️', desc: 'Unknown' };

                const temp = Math.round(current.temperature_2m);

                const dayNames = [
                    'Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'
                ];

                const forecastHTML = data.daily.time.map((date, index) => {
                    const forecastWeather =
                        weatherCodes[data.daily.weather_code[index]] ||
                        { emoji: '🌡️' };

                    const day =
                        index === 0
                            ? 'Today'
                            : dayNames[new Date(date).getDay()];

                    return `
                        <div class="forecast-day">
                            <div class="forecast-name">${day}</div>
                            <div class="forecast-icon">${forecastWeather.emoji}</div>
                            <div class="forecast-temp">
                                <span class="forecast-high">
                                    ${Math.round(data.daily.temperature_2m_max[index])}°
                                </span>
                                /
                                <span class="forecast-low">
                                    ${Math.round(data.daily.temperature_2m_min[index])}°
                                </span>
                            </div>
                        </div>
                    `;
                }).join('');

                document.getElementById('weatherWidget').innerHTML = `
                    <div class="weather-wrapper">
                        <div class="weather-container">

                            <div class="weather-location">
                                🌍 Taylors
                            </div>

                            <div class="weather-main">
                                <div class="weather-icon">
                                    ${weather.emoji}
                                </div>

                                <div>
                                    <div class="weather-temp">
                                        ${temp}°
                                    </div>

                                    <div class="weather-condition">
                                        ${weather.desc}
                                    </div>
                                </div>
                            </div>

                            <div class="weather-details">

                                <div class="detail-item">
                                    <div class="detail-label">Feels</div>
                                    <div class="detail-value">
                                        ${Math.round(current.apparent_temperature)}°
                                    </div>
                                </div>

                                <div class="detail-item">
                                    <div class="detail-label">Humidity</div>
                                    <div class="detail-value">
                                        ${current.relative_humidity_2m}%
                                    </div>
                                </div>

                                <div class="detail-item">
                                    <div class="detail-label">Wind</div>
                                    <div class="detail-value">
                                        ${Math.round(current.wind_speed_10m)} mph
                                    </div>
                                </div>

                            </div>
                        </div>

                        <div class="forecast-container">
                            ${forecastHTML}
                        </div>
                    </div>
                `;

            } catch (error) {
                document.getElementById('weatherWidget').innerHTML =
                    `<span class="error">Unable to load weather</span>`;
            }
        }

        getWeather();

        // Refresh every 30 minutes
        setInterval(getWeather, 30 * 60 * 1000);
    </script>
</body>
</html>
